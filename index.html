<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>CT Cumberland | Fuel Control</title>
<style>
:root {
  --blue:#0b4db5; --blue2:#155ccf; --green:#119640; --red:#d93025; --orange:#f59e0b;
  --line:#dfe6ee; --ink:#111827; --muted:#667085; --bg:#eef2f6; --card:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
button,input,select,textarea{font:inherit}
.phone{position:relative;width:min(100vw,520px);margin:0 auto;background:#fff;min-height:100vh;overflow:hidden}
.screen-img{display:block;width:100%;height:auto;user-select:none;-webkit-user-drag:none}
.hotspot{position:absolute;border:0;background:transparent;cursor:pointer;z-index:10;border-radius:12px}
.hotspot:active{background:rgba(11,77,181,.08)}
#hsFuel{left:4%;top:49%;width:18.7%;height:6.6%}
#hsDef{left:24%;top:49%;width:18.8%;height:6.6%}
#hsLoc{left:44%;top:49%;width:18.8%;height:6.6%}
#hsDamage{left:64%;top:49%;width:18.8%;height:6.6%}
#hsReplace{left:84%;top:49%;width:15%;height:6.6%}
#hsEdit{left:78.5%;top:3.5%;width:9%;height:5.2%}
#hsMore{left:91%;top:3.5%;width:7%;height:5.2%}
#hsHistory{left:3%;top:56.5%;width:20%;height:17.8%}
#hsMovements{left:24%;top:56.5%;width:22%;height:17.8%}
#hsSupplies{left:46%;top:56.5%;width:20%;height:17.8%}
#hsRepairs{left:67%;top:56.5%;width:30%;height:17.8%}
#hsHome{left:0%;top:94%;width:14%;height:6%}
#hsTowers{left:14%;top:94%;width:14%;height:6%}
#hsTanks{left:28%;top:94%;width:14%;height:6%}
#hsFuelNav{left:42%;top:94%;width:14%;height:6%}
#hsDefNav{left:56%;top:94%;width:14%;height:6%}
#hsReports{left:70%;top:94%;width:14%;height:6%}
#hsMoreNav{left:84%;top:94%;width:16%;height:6%}

.backdrop{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-end;justify-content:center;z-index:100}
.backdrop.show{display:flex}
.sheet{width:min(100%,520px);max-height:91vh;overflow:auto;background:#fff;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -12px 40px rgba(0,0,0,.18)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;gap:10px}
.sheet-head h2{margin:0;font-size:20px}
.close{border:0;background:#f2f4f7;width:38px;height:38px;border-radius:50%;font-size:18px;flex:0 0 auto}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:11px}
.field label{font-size:12px;font-weight:750}
.field input,.field select,.field textarea{border:1px solid #cfd8e3;border-radius:10px;padding:11px;background:#fff}
.field textarea{min-height:76px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;border:0;border-radius:11px;padding:12px;font-weight:800;min-width:110px}
.btn.primary{background:var(--blue);color:#fff}
.btn.secondary{background:#eef3fb;color:var(--blue)}
.btn.danger{background:#fff0f0;color:var(--red)}
.btn.green{background:#eaf8ef;color:#176638}
.info{background:#f7f9fc;border:1px solid var(--line);border-radius:12px;padding:11px;margin-bottom:12px;font-size:12px}
.success{display:none;background:#eefaf3;border:1px solid #bfe4ca;color:#176638;border-radius:11px;padding:10px;margin-bottom:12px;font-size:12px}
.warning{background:#fff8e8;border:1px solid #f8d991;color:#8a5a00;border-radius:11px;padding:10px;margin-bottom:12px;font-size:12px}
.list{display:flex;flex-direction:column;gap:8px}
.item{border:1px solid var(--line);border-radius:11px;padding:10px;font-size:12px;background:#fff}
.item b{display:block;margin-bottom:3px}
.pill{display:inline-block;border-radius:999px;padding:4px 8px;background:#edf3ff;color:var(--blue);font-weight:700;font-size:11px}
.pill.green{background:#eaf8ef;color:#176638} .pill.red{background:#fff0f0;color:var(--red)} .pill.orange{background:#fff7e8;color:#a66300}
.card{border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff}
.kpi{font-size:25px;font-weight:850}
.muted{color:var(--muted)}
.small{font-size:11px}
.progress{height:8px;background:#e9eef4;border-radius:999px;overflow:hidden;margin:7px 0}
.progress span{display:block;height:100%;background:var(--blue);border-radius:999px}
.search{display:flex;gap:8px;margin-bottom:12px}
.search input{flex:1;border:1px solid #cfd8e3;border-radius:10px;padding:11px}
.table{width:100%;border-collapse:collapse;font-size:11px}
.table th,.table td{border-bottom:1px solid var(--line);padding:8px;text-align:left;vertical-align:top}
.table th{background:#f8fafc}
.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:10px}
.tab{border:0;border-radius:999px;padding:8px 10px;background:#f2f4f7;color:#475467;font-size:11px;font-weight:700;white-space:nowrap}
.tab.active{background:#eaf1ff;color:var(--blue)}
.hidden-file{display:none}
@media(max-width:430px){.grid2,.grid3{grid-template-columns:1fr}}
@media print{
  body{background:#fff} .phone,.backdrop{display:none!important} #printArea{display:block!important}
}
#printArea{display:none}

.lang-switch{
  position:fixed;top:max(10px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
  z-index:95;background:#fff;border:1px solid #dfe6ee;border-radius:999px;padding:3px;
  display:flex;gap:2px;box-shadow:0 4px 14px rgba(15,23,42,.12)
}
.lang-switch button{border:0;background:transparent;border-radius:999px;padding:6px 11px;font-size:11px;font-weight:800;color:#667085}
.lang-switch button.active{background:#0b4db5;color:#fff}

</style>
</head>
<body>

<div class="lang-switch">
  <button id="langES" onclick="setLanguage('es')">ES</button>
  <button id="langEN" onclick="setLanguage('en')">EN</button>
</div>

function tr(s){
 if(appLang==='es'||s==null)return s;
 let out=String(s);
 Object.keys(DICT).sort((a,b)=>b.length-a.length).forEach(k=>{out=out.split(k).join(DICT[k])});
 return out;
}
function trHtml(s){return appLang==='es'?s:tr(s)}
function applyLanguage(){
 document.documentElement.lang=appLang;
 const esBtn=document.getElementById('langES'),enBtn=document.getElementById('langEN');
 if(esBtn)esBtn.classList.toggle('active',appLang==='es');
 if(enBtn)enBtn.classList.toggle('active',appLang==='en');
 const img=document.getElementById('mainScreen');
 if(img)img.src=appLang==='es'?ES_SCREEN:EN_SCREEN;
}
function setLanguage(lang){
 appLang=lang;localStorage.setItem(LANG_KEY,lang);applyLanguage();
 closeModal();
}

function clone(x){return JSON.parse(JSON.stringify(x))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||clone(seed)}catch(e){return clone(seed)}}
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function activeAsset(){return db.assets.find(a=>a.id===db.activeAssetId)||db.assets[0]}
function nowLocal(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,16)}
function dlabel(v){if(!v)return'—';return new Date(v).toLocaleString('es-US',{dateStyle:'medium',timeStyle:'short'})}
function fmt(n){return Number(n||0).toLocaleString('en-US',{maximumFractionDigits:1})}
function rank(loc){let i=PRIORITIES.indexOf(loc);return i<0?99:i+1}
function nextFuel(a){if(!a.lastFuel)return null;return new Date(new Date(a.lastFuel).getTime()+(a.refillHours||db.settings.defaultRefillHours||48)*3600000)}
function hoursLeft(a){let d=nextFuel(a);return d?(d-Date.now())/3600000:Infinity}
function alertLevel(a){let h=hoursLeft(a);if(h<=0)return'red';if(h<=db.settings.notifyBeforeHours)return'orange';if(h<=24)return'yellow';return'green'}
function show(title,html){document.getElementById('title').textContent=tr(title);document.getElementById('body').innerHTML=trHtml(html);document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function backdropClose(e){if(e.target.id==='modal')closeModal()}

function assetSelect(selected=''){return db.assets.filter(a=>a.status!=='Reemplazada').sort((a,b)=>rank(a.location)-rank(b.location)||a.serial.localeCompare(b.serial)).map(a=>`<option value="${a.id}" ${a.id===selected?'selected':''}>${a.serial} — ${a.location}</option>`).join('')}
function tankSelect(type,selected=''){return db.tanks.filter(t=>t.type===type).map(t=>`<option value="${t.id}" ${t.id===selected?'selected':''}>${t.name} — ${fmt(t.current)} gal</option>`).join('')}

}

function saveNewTank(){
 if(!name.value.trim()||!serialTank.value.trim())return alert('Nombre y serial son obligatorios.');
 db.tanks.push({id:'T'+Date.now(),name:name.value.trim(),serial:serialTank.value.trim(),type:type.value,capacity:Number(cap.value)||0,current:Number(cur.value)||0,location:loc.value.trim(),description:desc.value.trim(),status:'Activo'}); save();openTanks()
}

function openHistory(filter='all'){
 let arr=[...db.history].sort((a,b)=>new Date(b.date)-new Date(a.date));
 if(filter==='location')arr=arr.filter(x=>x.type==='location');
 if(filter==='supply')arr=arr.filter(x=>x.type==='fuel'||x.type==='def');
 if(filter==='damage')arr=arr.filter(x=>x.type==='damage'||x.type==='replace');
 const names={fuel:'Surtido de Combustible',def:'Surtido de DEF',location:'Cambio de Ubicación',damage:'Daño / Reparación',replace:'Reemplazo',tank_load:'Entrada a tanque',tank_replace:'Sustitución de tanque'};
 show('Historial',`<div class="tabs"><button class="tab active" onclick="openHistory('all')">Todo</button><button class="tab" onclick="openHistory('supply')">Surtidos</button><button class="tab" onclick="openHistory('location')">Movimientos</button><button class="tab" onclick="openHistory('damage')">Daños</button></div><div class="list">${arr.length?arr.map(x=>{const a=db.assets.find(y=>y.id===x.assetId),t=db.tanks.find(y=>y.id===x.tankId);return `<div class="item"><b>${names[x.type]||x.type}</b>${dlabel(x.date)}<br>${a?`${a.serial} · ${x.location||a.location}<br>`:''}${x.amount?`${fmt(x.amount)} gal`:''} ${t?`· ${t.name}`:''}${x.from?`<br>${x.from} → ${x.to}`:''}${x.status?`<br>Estado: ${x.status}`:''}${x.note?`<br><span class="muted">${x.note}</span>`:''}</div>`}).join(''):'<div class="info">Aún no hay registros.</div>'}</div>`)
}

function openReports(){
 const today=new Date().toISOString().slice(0,10);
 const day=db.history.filter(x=>(x.date||'').slice(0,10)===today);
 const fuel=day.filter(x=>x.type==='fuel').reduce((s,x)=>s+x.amount,0);
 const def=day.filter(x=>x.type==='def').reduce((s,x)=>s+x.amount,0);
 const serviced=new Set(day.filter(x=>x.assetId).map(x=>x.assetId)).size;
 show('Reportes',`
 <div class="grid3"><div class="card"><div class="small muted">COMBUSTIBLE HOY</div><div class="kpi">${fmt(fuel)}</div><div class="small">gal</div></div><div class="card"><div class="small muted">DEF HOY</div><div class="kpi">${fmt(def)}</div><div class="small">gal</div></div><div class="card"><div class="small muted">UNIDADES</div><div class="kpi">${serviced}</div><div class="small">atendidas</div></div></div>
 <div class="btns"><button class="btn primary" onclick="printDaily()">Imprimir / PDF</button><button class="btn secondary" onclick="exportCSV()">Exportar CSV</button></div>
 <div class="list">${day.filter(x=>x.type==='fuel'||x.type==='def').map(x=>{const a=db.assets.find(y=>y.id===x.assetId),t=db.tanks.find(y=>y.id===x.tankId);return `<div class="item"><b>${a?.serial||'—'} · ${x.type==='fuel'?'Combustible':'DEF'}</b>${dlabel(x.date)}<br>${x.location} · ${t?.name||'—'} · ${fmt(x.amount)} gal</div>`}).join('')||'<div class="info">Sin surtidos hoy.</div>'}</div>`)
}
function printDaily(){
 const today=new Date().toISOString().slice(0,10),day=db.history.filter(x=>(x.date||'').slice(0,10)===today),fuel=day.filter(x=>x.type==='fuel').reduce((s,x)=>s+x.amount,0),def=day.filter(x=>x.type==='def').reduce((s,x)=>s+x.amount,0);
 printArea.innerHTML=`<h1>CT Cumberland - Reporte Diario</h1><p>${new Date().toLocaleDateString('es-US')}</p><p><b>Combustible:</b> ${fmt(fuel)} gal<br><b>DEF:</b> ${fmt(def)} gal</p><table class="table"><thead><tr><th>Fecha</th><th>Tipo</th><th>Serial</th><th>Ubicación</th><th>Tanque</th><th>Galones</th></tr></thead><tbody>${day.filter(x=>x.type==='fuel'||x.type==='def').map(x=>{let a=db.assets.find(y=>y.id===x.assetId),t=db.tanks.find(y=>y.id===x.tankId);return `<tr><td>${dlabel(x.date)}</td><td>${x.type}</td><td>${a?.serial||''}</td><td>${x.location||''}</td><td>${t?.name||''}</td><td>${fmt(x.amount)}</td></tr>`}).join('')}</tbody></table>`;window.print()
}
function exportCSV(){
 const rows=[['Fecha','Tipo','Serial','Ubicación','Tanque','Galones','Nota']];
 db.history.forEach(x=>{if(x.type==='fuel'||x.type==='def'){let a=db.assets.find(y=>y.id===x.assetId),t=db.tanks.find(y=>y.id===x.tankId);rows.push([dlabel(x.date),x.type,a?.serial||'',x.location||'',t?.name||'',x.amount||'',x.note||''])}});
 const csv=rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(',')).join('\n');
 const b=new Blob(["\ufeff"+csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='CT_Cumberland_Historial.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)
}

function openReminders(){
 const arr=db.assets.filter(a=>a.status==='Operativa'&&a.lastFuel).sort((a,b)=>rank(a.location)-rank(b.location)||hoursLeft(a)-hoursLeft(b));
 show('Recordatorios',`<div class="warning">Se calcula desde la fecha/hora del último surtido. Intervalo por defecto: ${db.settings.defaultRefillHours} h.</div><div class="list">${arr.map(a=>`<div class="item"><b>${a.serial} · ${a.location}</b>Último: ${dlabel(a.lastFuel)}<br>Próximo: <b>${dlabel(nextFuel(a))}</b><br><span class="pill ${alertLevel(a)==='red'?'red':alertLevel(a)==='green'?'green':'orange'}">${alertLevel(a)==='red'?'VENCIDO':alertLevel(a)==='orange'?'PRIORITARIO':alertLevel(a)==='yellow'?'PRÓXIMO':'NORMAL'}</span></div>`).join('')}</div>`)
}


function isReportDay(d=new Date()){return [1,3,5].includes(d.getDay())}
function getOperationalDayData(dateObj=new Date()){
 const iso=new Date(dateObj.getTime()-dateObj.getTimezoneOffset()*60000).toISOString().slice(0,10);
 const arr=db.history.filter(x=>(x.date||'').slice(0,10)===iso),supplies=arr.filter(x=>x.type==='fuel');
 const fuel=supplies.reduce((s,x)=>s+Number(x.amount||0),0);
 const assets=[...new Set(supplies.map(x=>x.assetId))].map(id=>db.assets.find(a=>a.id===id)).filter(Boolean);
 const tanks=[...new Set(supplies.map(x=>x.tankId))].map(id=>db.tanks.find(t=>t.id===id)).filter(Boolean);
 return {iso,arr,supplies,fuel,assets,tanks};
}
function openScheduledReport(){
 const d=new Date(),data=getOperationalDayData(d),ready=isReportDay(d)&&d.getHours()>=16;
 show('Reporte operativo 4:00 PM',`<div class="${ready?'success':'warning'}" style="display:block">${ready?'Reporte de cierre disponible.':'El cierre corresponde a lunes, miércoles y viernes a las 4:00 PM.'}</div><div class="grid3"><div class="card"><div class="small muted">COMBUSTIBLE SURTIDO</div><div class="kpi">${fmt(data.fuel)}</div><div class="small">gal</div></div><div class="card"><div class="small muted">TORRES / GENERADORES</div><div class="kpi">${data.assets.length}</div><div class="small">atendidos</div></div><div class="card"><div class="small muted">TANQUES UTILIZADOS</div><div class="kpi">${data.tanks.length}</div><div class="small">tanques</div></div></div><div class="list" style="margin-top:10px">${data.assets.map(a=>`<div class="item"><b>${a.serial}</b>${a.type} · ${a.location}<br><span class="muted">${a.locationDescription||''}</span></div>`).join('')||'<div class="info">No hay unidades surtidas hoy.</div>'}${data.tanks.map(t=>`<div class="item"><b>${t.name} · ${t.serial||'Sin serial'}</b>${t.location}<br><span class="muted">Capacidad: ${fmt(t.capacity)} gal</span></div>`).join('')}</div><div class="btns"><button class="btn primary" onclick="printScheduledReport()">Imprimir / PDF</button></div>`)
}
function printScheduledReport(){
 const data=getOperationalDayData(new Date());
 printArea.innerHTML=`<h1>CT Cumberland - Reporte Operativo</h1><p>${new Date().toLocaleDateString('es-US')} · Cierre 4:00 PM</p><p><b>Combustible surtido:</b> ${fmt(data.fuel)} gal<br><b>Torres / generadores atendidos:</b> ${data.assets.length}<br><b>Tanques utilizados:</b> ${data.tanks.length}</p><h2>Unidades surtidas</h2>${data.assets.map(a=>`<p><b>${a.serial}</b> · ${a.type} · ${a.location}</p>`).join('')}<h2>Tanques utilizados</h2>${data.tanks.map(t=>`<p><b>${t.name}</b> · Serial ${t.serial||'—'} · ${t.location} · Capacidad ${fmt(t.capacity)} gal</p>`).join('')}`;window.print()
}
function maybeFourPmAlert(){
 const d=new Date(); if(!isReportDay(d)||d.getHours()!=16)return;
 const marker='ctc_report_alert_'+new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10); if(localStorage.getItem(marker))return; localStorage.setItem(marker,'1');
 if('Notification'in window&&Notification.permission==='granted')new Notification((appLang==='es'?'CT Cumberland - Reporte de cierre':'CT Cumberland - Closing Report'),{body:tr('Reporte de combustible, torres y tanques disponible para las 4:00 PM.')});
}
setInterval(maybeFourPmAlert,60000);

function openMore(){
 show('Más opciones',`
 <div class="list">
  <div class="item"><b>Reporte Lunes / Miércoles / Viernes</b><div class="btns"><button class="btn primary" onclick="openScheduledReport()">Abrir reporte 4:00 PM</button></div></div>
  <div class="item"><b>Recordatorios</b>Intervalo: ${db.settings.defaultRefillHours} h · aviso previo: ${db.settings.notifyBeforeHours} h<div class="btns"><button class="btn secondary" onclick="openReminders()">Ver</button><button class="btn secondary" onclick="openSettings()">Configurar</button></div></div>
  <div class="item"><b>Respaldo / Restauración</b><div class="btns"><button class="btn primary" onclick="backup()">Crear respaldo</button><button class="btn secondary" onclick="restoreFile.click()">Restaurar</button></div></div>
  <div class="item"><b>Notificaciones</b><button class="btn secondary" style="margin-top:8px" onclick="enableNotifications()">Habilitar notificaciones</button></div>
  <div class="item"><b>Datos locales</b>La información se guarda en este dispositivo.</div>
 </div>`)
}
function openSettings(){show('Configuración',`<div class="field"><label>Intervalo estándar de surtido (horas)</label><input id="refill" type="number" value="${db.settings.defaultRefillHours}"></div><div class="field"><label>Avisar con anticipación (horas)</label><input id="before" type="number" value="${db.settings.notifyBeforeHours}"></div><div class="btns"><button class="btn secondary" onclick="openMore()">Cancelar</button><button class="btn primary" onclick="saveSettings()">Guardar</button></div>`)}
function saveSettings(){db.settings.defaultRefillHours=Number(refill.value)||48;db.settings.notifyBeforeHours=Number(before.value)||8;save();openMore()}
function backup(){const b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='CT_Cumberland_Backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function restoreBackup(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);save();alert('Respaldo restaurado.');closeModal()}catch(err){alert('Archivo de respaldo inválido.')}};r.readAsText(f);e.target.value=''}
async function enableNotifications(){
 if(!('Notification' in window))return alert('Este navegador no admite notificaciones web.');
 const p=await Notification.requestPermission();alert(p==='granted'?'Notificaciones habilitadas.':'Permiso no concedido.');
}
function checkAlerts(){
 if(!('Notification' in window)||Notification.permission!=='granted')return;
 const alerts=db.assets.filter(a=>a.status==='Operativa'&&hoursLeft(a)<=db.settings.notifyBeforeHours&&hoursLeft(a)>0);
 if(alerts.length){const a=alerts.sort((x,y)=>rank(x.location)-rank(y.location)||hoursLeft(x)-hoursLeft(y))[0];new Notification((appLang==='es'?'CT Cumberland - Próximo surtido':'CT Cumberland - Next Refuel'),{body:`${a.serial} · ${a.location} · ${dlabel(nextFuel(a))}`})}
}
setInterval(checkAlerts,60*60*1000);
applyLanguage();
</script>
</body>
