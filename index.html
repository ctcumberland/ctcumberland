<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>CT Cumberland | Control de Combustible</title>
<style>
:root{
 --blue:#0a46a8;--blue2:#0c59d5;--green:#0b9a3e;--ink:#111827;--muted:#667085;
 --line:#dfe5ec;--bg:#f7f9fc;--card:#fff;--orange:#f59e0b;--red:#dc2626;--purple:#6d28d9;
}
*{box-sizing:border-box}
html,body{margin:0;background:#eef2f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
.app{width:min(100%,520px);min-height:100vh;margin:0 auto;background:#fff;box-shadow:0 0 0 1px #e8edf3}
.status{height:30px;display:flex;align-items:center;justify-content:space-between;padding:5px 16px 0;font-size:13px;font-weight:800}
.header{display:grid;grid-template-columns:48px 1fr 104px;align-items:center;padding:4px 13px 10px;border-bottom:1px solid var(--line);background:#fff;position:sticky;top:0;z-index:20}
.back{font-size:28px;background:none;border:0}
.logo{display:flex;justify-content:center}
.logo img{height:82px;max-width:235px;object-fit:contain}
.head-actions{display:flex;justify-content:flex-end;gap:4px}
.head-btn{border:0;background:#fff;padding:4px;text-align:center;font-size:11px;color:#111}
.head-btn b{font-size:23px;display:block;line-height:1.1}
.lang{position:absolute;right:12px;top:108px;z-index:15;display:flex;background:#fff;border:1px solid var(--line);border-radius:999px;padding:2px;box-shadow:0 2px 8px #0001}
.lang button{border:0;background:transparent;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900;color:#667085}
.lang button.active{background:var(--blue);color:#fff}
.main{padding:12px 12px 84px;background:#fff}
.equipment-selector{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.type-card{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px;min-height:126px;text-align:center}
.type-card.active{border:2px solid var(--blue);box-shadow:0 0 0 2px #dbeafe}
.type-card img{height:84px;width:100%;object-fit:contain;border-radius:9px;background:#fff}
.type-card strong{display:block;font-size:12px;margin-top:4px;color:var(--blue)}
.select-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:end;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:11px;font-weight:800;color:#344054}
.field select,.field input,.field textarea{border:1px solid #cfd7e2;border-radius:10px;padding:10px 11px;background:#fff;color:#111}
.update-btn{border:0;background:#eef3ff;color:var(--blue);border-radius:10px;padding:10px 12px;font-weight:850}
.hero{display:grid;grid-template-columns:198px 1fr;gap:14px;align-items:start}
.photo-card{border:1px solid var(--line);border-radius:14px;background:#fff;min-height:260px;display:flex;align-items:center;justify-content:center;overflow:hidden}
.photo-card img{width:100%;height:260px;object-fit:contain;background:#fff}
.eyebrow{font-size:14px;font-weight:850;color:var(--blue);margin-top:4px}
.asset-title{font-size:39px;font-weight:900;line-height:1.03;letter-spacing:-1px;margin:4px 0 7px}
.status-pill{display:inline-flex;align-items:center;gap:7px;border:1px solid #a7dfb7;background:#effbf2;color:#08772f;border-radius:999px;padding:7px 11px;font-size:12px;font-weight:850;margin-bottom:8px}
.dot{width:9px;height:9px;border-radius:50%;background:#0b9a3e}
.spec{display:grid;grid-template-columns:155px 1fr;gap:6px;border-bottom:1px solid #edf0f4;padding:7px 0;font-size:12px}
.spec span:first-child{color:#344054}
.cards3{display:grid;grid-template-columns:1.06fr 1fr .94fr;gap:9px;margin-top:12px}
.card{border:1px solid var(--line);border-radius:13px;background:#fff;padding:12px;box-shadow:0 1px 2px #00000008}
.card-title{font-size:12px;font-weight:900;color:var(--blue);display:flex;align-items:center;gap:6px}
.big{font-size:32px;font-weight:900;letter-spacing:-.5px;margin:8px 0 4px}
.loc-name{font-size:17px;font-weight:850;margin:9px 0 5px}
.desc{font-size:11px;line-height:1.45;color:#344054}
.section-title{font-size:14px;font-weight:900;margin:16px 0 8px}
.levels{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.level-card{border:1px solid var(--line);border-radius:13px;padding:12px}
.level-head{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center}
.level-icon{font-size:28px}
.level-name{font-size:12px;font-weight:850}
.level-pct{font-size:30px;font-weight:900;line-height:1;color:var(--green);margin-top:3px}
.level-pct.blue{color:var(--blue)}
.level-amt{font-size:12px;text-align:right}
.progress{height:7px;background:#e8edf3;border-radius:999px;overflow:hidden;margin:10px 0 8px}
.progress span{height:100%;display:block;background:var(--green);border-radius:999px}
.progress.blue span{background:var(--blue)}
.mini{font-size:10px;line-height:1.35}
.quick{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.quick button{border:1px solid var(--line);border-radius:12px;background:#fff;padding:10px 4px;min-height:89px;font-size:10px;font-weight:800}
.quick .ico{display:block;font-size:25px;margin-bottom:6px}
.history{border:1px solid var(--line);border-radius:13px;overflow:hidden;margin-top:14px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);border-bottom:1px solid var(--line)}
.tab{border:0;background:#fff;padding:11px 2px;font-size:10px;font-weight:850}
.tab.active{color:var(--blue);border-bottom:3px solid var(--blue)}
.hist-row{display:grid;grid-template-columns:40px 1.2fr 1fr auto 20px;gap:7px;align-items:center;padding:10px 12px;border-bottom:1px solid #edf0f4;font-size:10px}
.hist-row:last-child{border-bottom:0}
.hist-icon{width:34px;height:34px;border-radius:50%;background:#effaf3;display:grid;place-items:center;font-size:18px}
.hist-title{font-weight:850;font-size:11px}
.amount{font-weight:900;color:var(--green);white-space:nowrap}
.amount.blue{color:var(--blue)}
.alert{display:grid;grid-template-columns:1fr 1fr;gap:12px;background:#fff8e8;border:1px solid #f5d79e;border-radius:13px;margin-top:13px;padding:11px}
.alert b{color:#d98a00;font-size:11px}
.alert div{font-size:10px;line-height:1.35}
.bottom{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(100%,520px);display:grid;grid-template-columns:repeat(7,1fr);background:#58b8ed;border-top:1px solid #ffffff;padding:7px 2px max(6px,env(safe-area-inset-bottom));z-index:30}
.bottom button{border:0;border-right:1px solid rgba(255,255,255,.95);background:transparent;font-size:8px;color:#ffffff;padding:6px 2px}
.bottom .ico{display:block;font-size:19px;margin-bottom:2px}
.bottom button:last-child{border-right:0}.bottom button.active{color:#0a46a8;font-weight:900;background:rgba(255,255,255,.92);border-radius:9px;margin:2px 4px}
.modal{position:fixed;inset:0;background:#11182766;display:none;align-items:flex-end;justify-content:center;z-index:50}
.modal.show{display:flex}
.sheet{width:min(100%,520px);background:#fff;border-radius:20px 20px 0 0;padding:16px 14px max(20px,env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.sheet-head h2{margin:0;font-size:18px}
.close{border:0;background:#f2f4f7;border-radius:50%;width:36px;height:36px}
.btns{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;border:0;border-radius:10px;padding:11px;font-weight:850}
.btn.primary{background:var(--blue);color:#fff} .btn.secondary{background:#edf3ff;color:var(--blue)} .btn.danger{background:#fff1f2;color:#b42318}
.list{display:flex;flex-direction:column;gap:8px}
.list-item{border:1px solid var(--line);border-radius:11px;padding:10px;font-size:11px}
@media(max-width:480px){
 .hero{grid-template-columns:1fr 1.35fr}
 .photo-card,.photo-card img{min-height:230px;height:230px}
 .asset-title{font-size:32px}
 .spec{grid-template-columns:130px 1fr}
 .cards3{grid-template-columns:1fr 1fr}
 .cards3 .card:last-child{grid-column:1 / -1}
}
@media(max-width:390px){
 .main{padding-left:9px;padding-right:9px}
 .hero{grid-template-columns:145px 1fr;gap:9px}
 .photo-card,.photo-card img{height:210px;min-height:210px}
 .asset-title{font-size:27px}
 .spec{grid-template-columns:1fr;gap:2px;padding:5px 0}
 .quick{grid-template-columns:repeat(3,1fr)}
 .levels{grid-template-columns:1fr}
 .hist-row{grid-template-columns:34px 1fr auto 18px}
 .hist-row .datecol{display:none}
}

#tankType img{background:#f7f8fa!important}
#tankType{background:#fbfcfd}
body.tank-selected .photo-card,
body.tank-selected .photo-card img{background:#f7f8fa!important}


.dynamic-summary{margin-top:10px;border:1px solid var(--line);border-radius:12px;padding:11px;background:#fbfcfd}
.dynamic-summary h4{margin:0 0 8px;font-size:12px;color:var(--blue)}
.dynamic-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.dynamic-box{border:1px solid #e4e9ef;border-radius:10px;padding:9px;background:#fff}
.dynamic-box .k{font-size:9px;color:var(--muted);font-weight:800;text-transform:uppercase}
.dynamic-box .v{font-size:15px;font-weight:900;margin-top:3px}
.camera-btn{width:100%;border:0;background:#eef6ff;color:var(--blue);border-radius:10px;padding:11px;font-weight:850;margin-top:9px}
.camera-input{display:none}
.calc-note{font-size:10px;color:#475467;line-height:1.35;margin-top:7px}


/* V17 — ONLY tank background correction. Original image preserved byte-for-byte. */
#tankType,
#tankType .type-photo,
#tankType .type-img,
#tankType img {
    background-color:#ffffff !important;
}


.demo-search{width:100%;border:1px solid #cfd8e3;border-radius:10px;padding:11px;margin-bottom:10px}
.demo-item{width:100%;text-align:left;border:1px solid var(--line);background:#fff;border-radius:11px;padding:10px;margin-bottom:7px}
.demo-item b{font-size:12px;color:var(--blue)}
.demo-item .sub{font-size:10px;color:#667085;margin-top:3px;line-height:1.35}
.demo-actions{display:flex;gap:7px;margin-top:7px}
.demo-actions button{border:0;border-radius:8px;padding:7px 9px;font-size:10px;font-weight:800}
.demo-select{background:#edf3ff;color:var(--blue)}
.demo-edit{background:#f2f4f7;color:#344054}


#towerType,#tankType{touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,0)}
#towerType img{image-rendering:auto}

</style>
</head>

function isSupplyDay(dateObj=new Date()){
  return SUPPLY_DAYS.includes(dateObj.getDay());
}
function todayISO(){
  const d=new Date();
  return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10);
}
function dailyDieselTotal(dateStr=todayISO()){
  return db.history.filter(h=>h.kind==='fuel' && (h.date||'').slice(0,10)===dateStr)
    .reduce((s,h)=>s+Number(h.amount||0),0);
}
function dailyDefTotal(dateStr=todayISO()){
  return db.history.filter(h=>h.kind==='def' && (h.date||'').slice(0,10)===dateStr)
    .reduce((s,h)=>s+Number(h.amount||0),0);
}
function dailyServicedUnits(dateStr=todayISO()){
  return [...new Set(db.history.filter(h=>(h.kind==='fuel'||h.kind==='def') && (h.date||'').slice(0,10)===dateStr).map(h=>h.towerId))];
}
function priorityRank(loc){
  const i=PRIORITY_LOCATIONS.indexOf(loc);
  return i<0?99:i+1;
}

function supplyClass(dateValue){
  const d=new Date(dateValue);
  return isSupplyDay(d)?'scheduled':'unscheduled';
}
function weekRange(ref=new Date()){
  const d=new Date(ref); d.setHours(12,0,0,0);
  const day=d.getDay(), diff=(day===0?-6:1-day);
  const start=new Date(d); start.setDate(d.getDate()+diff);
  const end=new Date(start); end.setDate(start.getDate()+6);
  const iso=x=>new Date(x.getTime()-x.getTimezoneOffset()*60000).toISOString().slice(0,10);
  return {start:iso(start),end:iso(end)};
}
function buildWeeklyReport(ref=new Date()){
  const w=weekRange(ref);
  const rows=db.history.filter(h=>(h.kind==='fuel'||h.kind==='def') && (h.date||'').slice(0,10)>=w.start && (h.date||'').slice(0,10)<=w.end)
    .map(h=>({...h,supplyType:h.supplyType||supplyClass(h.date)}))
    .sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const fuel=rows.filter(h=>h.kind==='fuel').reduce((s,h)=>s+Number(h.amount||0),0);
  const def=rows.filter(h=>h.kind==='def').reduce((s,h)=>s+Number(h.amount||0),0);
  return {w,rows,fuel,def,scheduled:rows.filter(h=>h.supplyType==='scheduled'),unscheduled:rows.filter(h=>h.supplyType==='unscheduled')};
}

function latestFuelRecordForTower(towerId){
 const arr=(db.history||[]).filter(h=>h.kind==='fuel'&&h.towerId===towerId).sort((a,b)=>new Date(b.date)-new Date(a.date));
 return arr[0]||null;
}
function tankMovementDates(tankId){
 return (db.history||[]).filter(h=>h.tankId===tankId).sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,5);
}
function estimatedFuelState(x){
 const last=latestFuelRecordForTower(x.id);
 const baseMeter=last && last.hourMeter!=null ? Number(last.hourMeter) : null;
 const currentMeter=x.hourMeter!=null?Number(x.hourMeter):null;
 const rate=Number(x.consumptionRateGph||1.2);
 let consumed=0;
 if(baseMeter!=null && currentMeter!=null && currentMeter>=baseMeter) consumed=(currentMeter-baseMeter)*rate;
 const baseFuel = last ? Math.min(Number(x.fuelCapacity||0), Number(last.amount||0)) : Number(x.fuelLevel||0);
 const remaining=Math.max(0,Math.min(Number(x.fuelCapacity||0),baseFuel-consumed));
 const missing=Math.max(0,Number(x.fuelCapacity||0)-remaining);
 return {baseMeter,currentMeter,rate,consumed,remaining,missing,last};
}

function tankMeterPhotoTaken(e){
 const file=e.target.files&&e.target.files[0];
 if(!file)return;
 const x=active();
 if(db.type!=='tank')return;
 x.lastMeterPhotoTime=new Date().toISOString();

 const message=db.lang==='es'
   ?'Confirma la lectura visible del horómetro del tanque (horas):'
   :'Confirm the visible tank hour-meter reading (hours):';

 const val=prompt(message,x.hourMeter||'');
 if(val!==null && val!==''){
   const n=Number(val);
   if(!Number.isNaN(n))x.hourMeter=n;
 }

 // Register a meter event for date/day/time history.
 db.history.push({
   id:Date.now(),
   kind:'tank_meter',
   tankId:x.id,
   date:x.lastMeterPhotoTime,
   hourMeter:x.hourMeter,
   location:x.location
 });
 save();
 render();
 e.target.value='';
}

const ADMIN_PIN_KEY = KEY + '_admin_pin';

function simpleHash(str){
  let h = 2166136261;
  for(let i=0;i<str.length;i++){
    h ^= str.charCodeAt(i);
    h = Math.imul(h,16777619);
  }
  return (h>>>0).toString(16);
}

function ensureAdminPin(){
  let saved = localStorage.getItem(ADMIN_PIN_KEY);
  if(saved) return true;

  const p1 = prompt(db.lang==='es'
    ? 'Crea tu PIN de Administrador de 4 dígitos:'
    : 'Create your 4-digit Administrator PIN:');
  if(p1===null) return false;

  if(!/^\d{4}$/.test(p1)){
    alert(db.lang==='es'
      ? 'El PIN debe tener exactamente 4 dígitos.'
      : 'The PIN must be exactly 4 digits.');
    return false;
  }

  const p2 = prompt(db.lang==='es'
    ? 'Confirma el PIN de 4 dígitos:'
    : 'Confirm the 4-digit PIN:');

  if(p2!==p1){
    alert(db.lang==='es'?'Los PIN no coinciden.':'PINs do not match.');
    return false;
  }

  localStorage.setItem(ADMIN_PIN_KEY, simpleHash(p1));
  alert(db.lang==='es'
    ? 'PIN de Administrador creado.'
    : 'Administrator PIN created.');
  return true;
}

function requestAdminPin(callback){
  if(!ensureAdminPin()) return;

  const pin = prompt(db.lang==='es'
    ? 'Ingresa el PIN de Administrador de 4 dígitos:'
    : 'Enter the 4-digit Administrator PIN:');

  if(pin===null) return;

  if(!/^\d{4}$/.test(pin)){
    alert(db.lang==='es'
      ? 'El PIN debe tener exactamente 4 dígitos.'
      : 'The PIN must be exactly 4 digits.');
    return;
  }

  if(simpleHash(pin)!==localStorage.getItem(ADMIN_PIN_KEY)){
    alert(db.lang==='es'
      ? 'PIN incorrecto. Acceso denegado.'
      : 'Incorrect PIN. Access denied.');
    return;
  }

  if(typeof callback==='function') callback();
}

function adminEdit(){

function resetAdminPin(){
  requestAdminPin(()=>{
    const ok=confirm(db.lang==='es'
      ? '¿Eliminar el PIN actual y crear uno nuevo la próxima vez?'

    if(ok){
      localStorage.removeItem(ADMIN_PIN_KEY);
      alert(db.lang==='es'?'PIN eliminado.':'PIN removed.');
    }
  });
}

function hoursBetween(a,b){
  if(!a||!b)return 0;
  const ms=new Date(b)-new Date(a);
  return ms>0?ms/3600000:0;
}
function daysBetween(a,b){return hoursBetween(a,b)/24;}
function calcConsumptionStats(capacity,currentBeforeFill,lastRefillDate,nowDate){
  capacity=Number(capacity||0); currentBeforeFill=Math.max(0,Number(currentBeforeFill||0));
  const consumed=Math.max(0,capacity-currentBeforeFill);
  const days=daysBetween(lastRefillDate,nowDate);
  const perDay=days>0?consumed/days:0;
  const daysRemaining=perDay>0?currentBeforeFill/perDay:null;
  return {consumed,days,perDay,daysRemaining};
}
function fmtDays(v){
  if(v===null||!isFinite(v))return '—';
  return Number(v).toLocaleString(undefined,{maximumFractionDigits:1});
}

function recordFuel(){
 const mode=document.getElementById('fuelTargetMode').value;
 const dateValue=when.value;
 const tank=db.tanks.find(k=>k.id===sourceTank.value);
 const mainMissing=Math.max(0,Number(missingMain.value)||0);

 if(mode==='new'){
   const ref=fuelNewReference.value.trim(),serial=fuelNewSerial.value.trim(),color=fuelNewColor.value.trim();
   const cls=fuelNewClass.value,cap=Number(fuelNewCapacity.value)||0,loc=fuelNewLocation.value,office=locationIsMobil(loc)?(fuelNewOffice.value||''):'',tent=locationIsCampaignTent(loc)?(fuelNewTent.value||''):'',desc=fuelNewDescription.value.trim();
   if(!serial||!cap||!loc)return alert(db.lang==='es'?'Completa serial, capacidad y ubicación.':'Complete serial, capacity, and location.');
   if(mainMissing>cap)return alert(db.lang==='es'?'El faltante no puede superar la capacidad.':'Missing amount cannot exceed capacity.');

   if(cls==='reserve_tank'){
     const id='T'+Date.now();
     const current=Math.max(0,cap-mainMissing);
     db.tanks.push({
       id,name:'Tanque de respaldo',serial,referenceNumber:ref,color,equipmentClass:'reserve_tank',
       capacity:cap,current:cap,location:loc,mobileOffice:office,campaignTent:tent,description:desc,status:'Activo',removable:true,
       lastFill:dateValue,hourMeter:0,lastMeterPhotoTime:null,avgGalPerDay:0,lastConsumed:mainMissing,lastConsumptionDays:0
     });
     db.activeTank=id;
     if(tank&&typeof tank.current==='number')tank.current=Math.max(0,tank.current-mainMissing);
     db.history.push({id:Date.now(),kind:'fuel',tankId:id,sourceTankId:tank?.id||null,date:dateValue,amount:mainMissing,location:loc,supplyType:supplyClass(dateValue),referenceNumber:ref,color,equipmentClass:cls});
     db.type='tank';
     save();closeModal();render();
     alert(db.lang==='es'?'Nuevo tanque de respaldo agregado y surtido registrado.':'New reserve tank added and refuel recorded.');
     return;
   }

   const hasBackup=fuelNewHasBackup.value==='yes';
   const backupCap=hasBackup?(Number(fuelNewBackupCapacity.value)||0):0;
   const id='A'+Date.now();
   const typeName=cls==='generator'?'Generador':'Torre de luz';
   const x={
     id,serial,referenceNumber:ref,color,equipmentClass:cls,type:typeName,model:'',code:ref,
     fuelCapacity:cap,defCapacity:8,location:loc,mobileOffice:office,campaignTent:tent,description:desc,status:'Operativa',hourMeter:null,
     lastFuel:dateValue,lastDef:null,fuelLevel:cap,defLevel:0,priority:99,removable:true,
     consumptionRateGph:0,lastMeterPhoto:null,lastMeterPhotoTime:null,
     hasBackupTank:hasBackup,backupCapacity:backupCap,backupLevel:backupCap,backupLastRefill:hasBackup?dateValue:null,
     backupAvgGalPerDay:0,backupLastConsumed:0,avgGalPerDay:0,lastConsumed:mainMissing,lastConsumptionDays:0
   };
   db.towers.push(x);db.activeTower=id;db.type='tower';
   let backupMissing=0;
   if(hasBackup && document.getElementById('missingBackup'))backupMissing=Number(missingBackup.value)||0;
   const totalAdded=mainMissing+backupMissing;
   if(tank&&typeof tank.current==='number')tank.current=Math.max(0,tank.current-totalAdded);
   db.history.push({id:Date.now(),kind:'fuel',towerId:id,tankId:tank?.id||null,date:dateValue,amount:mainMissing,backupAmount:backupMissing,location:loc,hourMeter:null,supplyType:supplyClass(dateValue),referenceNumber:ref,color,equipmentClass:cls,note:tank?`${tank.serial||tank.name} · ${tank.location}`:''});
   save();closeModal();render();
   alert(db.lang==='es'?`Nuevo ${typeName.toLowerCase()} agregado y surtido registrado.`:`New ${cls==='generator'?'generator':'light tower'} added and refuel recorded.`);
   return;
 }

 const x=db.towers.find(a=>a.id===fuelExistingAsset.value);
 if(!x)return;
 if(mainMissing>x.fuelCapacity)return alert(db.lang==='es'?'El faltante no puede superar la capacidad principal.':'Missing amount cannot exceed main tank capacity.');

 const mainStats=calcConsumptionStats(x.fuelCapacity,Math.max(0,x.fuelCapacity-mainMissing),x.lastFuel,dateValue);
 if(x.lastFuel){x.lastConsumed=mainMissing;x.lastConsumptionDays=mainStats.days;x.avgGalPerDay=mainStats.days>0?mainMissing/mainStats.days:0;}
 x.fuelLevel=x.fuelCapacity;x.lastFuel=dateValue;

 let backupMissing=0;
 if(x.hasBackupTank){
   backupMissing=Math.max(0,Number(document.getElementById('missingBackup')?.value)||0);
   if(backupMissing>x.backupCapacity)return alert(db.lang==='es'?'El faltante del respaldo supera su capacidad.':'Backup missing amount exceeds capacity.');
   const stats=calcConsumptionStats(x.backupCapacity,Math.max(0,x.backupCapacity-backupMissing),x.backupLastRefill,dateValue);
   if(x.backupLastRefill){x.backupLastConsumed=backupMissing;x.backupAvgGalPerDay=stats.days>0?backupMissing/stats.days:0;}
   x.backupLevel=x.backupCapacity;x.backupLastRefill=dateValue;
 }

 const totalAdded=mainMissing+backupMissing;
 if(tank&&typeof tank.current==='number'){tank.current=Math.max(0,tank.current-totalAdded);tank.lastFill=dateValue;}

 db.history.push({
   id:Date.now(),kind:'fuel',towerId:x.id,tankId:tank?.id||null,date:dateValue,amount:mainMissing,
   backupAmount:backupMissing,location:x.location,hourMeter:x.hourMeter??null,
   supplyType:supplyClass(dateValue),consumptionDays:mainStats.days,avgGalPerDay:x.avgGalPerDay||0,
   referenceNumber:x.referenceNumber||x.code||'',color:x.color||'',equipmentClass:x.equipmentClass||'light_tower',
   note:tank?`${tank.serial||tank.name} · ${tank.location}`:''
 });
 save();closeModal();render();
 alert(db.lang==='es'?`Surtido registrado. Consumido: ${fmt(mainMissing)} gal${x.avgGalPerDay?` · ${fmt(x.avgGalPerDay)} gal/día`:''}`:`Refuel saved. Consumed: ${fmt(mainMissing)} gal${x.avgGalPerDay?` · ${fmt(x.avgGalPerDay)} gal/day`:''}`);
}

function buildDailyReport(){
 const d=todayISO();
 const fuel=dailyDieselTotal(d),def=dailyDefTotal(d);
 const serviced=dailyServicedUnits(d);
 const units=serviced.map(id=>db.towers.find(x=>x.id===id)).filter(Boolean).sort((a,b)=>priorityRank(a.location)-priorityRank(b.location));
 const tankIds=[...new Set(db.history.filter(h=>h.kind==='fuel' && (h.date||'').slice(0,10)===d).map(h=>h.tankId).filter(Boolean))];
 const tanks=tankIds.map(id=>db.tanks.find(x=>x.id===id)).filter(Boolean);
 return {d,fuel,def,units,tanks};
}

function generateWeeklyPDF(lang){
 const r=buildWeeklyReport(), es=lang==='es';
 const title=es?'REPORTE FINAL SEMANAL DE COMBUSTIBLE':'FINAL WEEKLY FUEL REPORT';
 const rows=r.rows.map(h=>{
   const u=db.towers.find(x=>x.id===h.towerId);
   const tk=db.tanks.find(x=>x.id===h.tankId);
   const type=h.supplyType==='scheduled'?(es?'PROGRAMADO':'SCHEDULED'):(es?'EXTRAORDINARIO':'UNSCHEDULED');
   return `<tr><td>${esc(new Date(h.date).toLocaleString(lang==='es'?'es-US':'en-US'))}</td><td>${type}</td><td>${esc(u?.serial||'—')}</td><td>${esc(h.location||u?.location||'—')}</td><td>${h.kind==='fuel'?fmt(h.amount)+' gal':'—'}</td><td>${h.kind==='def'?fmt(h.amount)+' gal':'—'}</td><td>${h.hourMeter??u?.hourMeter??'—'}</td><td>${esc(tk?.serial||h.note||'—')}</td></tr>`;
 }).join('');
 const daily={};
 r.rows.forEach(h=>{const d=(h.date||'').slice(0,10);daily[d]??={fuel:0,def:0};daily[d][h.kind]+=Number(h.amount||0)});
 const dailyRows=Object.entries(daily).map(([d,v])=>`<tr><td>${d}</td><td>${fmt(v.fuel)} gal</td><td>${fmt(v.def)} gal</td></tr>`).join('');

function weeklyCloseReminder(){
 const n=new Date();
 if(n.getDay()!==5 || n.getHours()!==14)return;
 const stamp=todayISO();
 if(localStorage.getItem(KEY+'_weekly_2pm')===stamp)return;
 localStorage.setItem(KEY+'_weekly_2pm',stamp);
 setTimeout(()=>{ if(confirm(db.lang==='es'?'Son las 2:00 PM. El reporte final semanal está listo. ¿Abrir Reportes?':'It is 2:00 PM. The final weekly report is ready. Open Reports?')) openReport(); },300);
}



function goHome(){
  db.type='tower';
  if(db.towers && db.towers.length && !db.activeTower) db.activeTower=db.towers[0].id;
  save();
  closeModal();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

function openActiveTankList(){
  db.type='tank';
  const activeTanks=(db.tanks||[]).filter(x=>{
    const s=String(x.status||'').toLowerCase();
    return !['inactive','inactivo','removed','removido','fuera de servicio'].includes(s);
  });

  // Reuse the existing searchable demo-list modal without changing the design.
  const original=db.tanks;
  db.tanks=activeTanks;
  try{
    if(typeof openDemoList==='function'){
      openDemoList('tank');
    }else if(typeof openAssetList==='function'){
      openAssetList('tank');
    }else{
      const body=activeTanks.map(x=>`
        <button class="list-row" onclick="selectActiveTank('${x.id}')">
          <b>${x.serial||x.code||x.name||'—'}</b>
          <span>${x.capacity?fmt(x.capacity*3.78541)+' L':'—'} · ${x.location||'—'}</span>
        </button>`).join('');
      openModal(db.lang==='es'?'Tanques activos':'Active tanks',
        `<div class="search-wrap"><input id="activeTankSearch" placeholder="${db.lang==='es'?'Buscar tanque...':'Search tank...'}" oninput="filterActiveTankRows(this.value)"></div>
         <div id="activeTankRows">${body||`<div class="calc-note">${db.lang==='es'?'No hay tanques activos.':'No active tanks.'}</div>`}</div>`);
    }
  } finally {
    db.tanks=original;
  }
}
function selectActiveTank(id){
  db.type='tank';
  db.activeTank=id;
  save();
  closeModal();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}
function filterActiveTankRows(q){
  q=String(q||'').toLowerCase();
  document.querySelectorAll('#activeTankRows .list-row').forEach(el=>{
    el.style.display=el.textContent.toLowerCase().includes(q)?'':'none';
  });
}

function applyGlobalLanguageFixed(){
  const lang=db.lang||DEVICE_LANG;
  document.documentElement.lang=lang;
  const map=GLOBAL_TEXT[lang]||{};
  const walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);
  const nodes=[];
  while(walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach(n=>{
    const raw=n.nodeValue, key=(raw||'').trim();
    if(key && map[key]) n.nodeValue=raw.replace(key,map[key]);
  });
  document.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
    ['placeholder','title','aria-label'].forEach(a=>{
      const v=el.getAttribute(a);
      if(v && map[v]) el.setAttribute(a,map[v]);
    });
  });
}
const _renderV13=render;
render=function(){_renderV13.apply(this,arguments);setTimeout(applyGlobalLanguageFixed,0);}
const _openModalV13=openModal;
openModal=function(){_openModalV13.apply(this,arguments);setTimeout(applyGlobalLanguageFixed,0);}
const _setLangV13=setLang;

function normalizeFuelData(){
 (db.towers||[]).forEach(x=>{
   if(typeof x.referenceNumber==='undefined')x.referenceNumber=x.code||'';
   if(typeof x.color==='undefined')x.color='';
   if(typeof x.equipmentClass==='undefined')x.equipmentClass=(x.type||'').toLowerCase().includes('generador')?'generator':'light_tower';
   if(typeof x.mobileOffice==='undefined')x.mobileOffice='';
   if(typeof x.campaignTent==='undefined')x.campaignTent='';
  if(typeof x.hasBackupTank==='undefined')x.hasBackupTank=false;
  if(typeof x.backupCapacity==='undefined')x.backupCapacity=0;
  if(typeof x.backupLevel==='undefined')x.backupLevel=0;
  if(typeof x.backupLastRefill==='undefined')x.backupLastRefill=null;
  if(typeof x.backupAvgGalPerDay==='undefined')x.backupAvgGalPerDay=0;
  if(typeof x.backupLastConsumed==='undefined')x.backupLastConsumed=0;
  if(typeof x.lastConsumed==='undefined')x.lastConsumed=0;
  if(typeof x.avgGalPerDay==='undefined')x.avgGalPerDay=0;
  if(typeof x.lastConsumptionDays==='undefined')x.lastConsumptionDays=0;
 });
 (db.tanks||[]).forEach(x=>{
   if(typeof x.referenceNumber==='undefined')x.referenceNumber='';
   if(typeof x.color==='undefined')x.color='';
   if(typeof x.equipmentClass==='undefined')x.equipmentClass='reserve_tank';
   if(typeof x.mobileOffice==='undefined')x.mobileOffice='';
   if(typeof x.campaignTent==='undefined')x.campaignTent='';
  if(typeof x.lastConsumed==='undefined')x.lastConsumed=0;
  if(typeof x.avgGalPerDay==='undefined')x.avgGalPerDay=0;
 });
 save();
}
